<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Incentive Console</title>
<link rel="icon" id="favicon-link" type="image/jpeg" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --frame:#0F2A3D;
    --frame-2:#173C54;
    --frame-line:#2A4E63;
    --paper:#F1F5F3;
    --paper-2:#E1EAE7;
    --ink:#16242A;
    --ink-soft:#55666B;
    --brass:#2E8B6B;
    --brass-dim:#236B52;
    --teal:#2C6E8E;
    --teal-dim:#20536C;
    --rust:#B14A3A;
    --paper-text:#E6EEEC;
    --ok:#2C6E8E;
    --warn:#2E8B6B;
    --bad:#B14A3A;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'IBM Plex Sans',sans-serif;
    background:var(--frame);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px;
    flex:none;
    height:100vh;
    overflow-y:auto;
    background:var(--frame);
    color:var(--paper-text);
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--frame-line);
  }
  .brand{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid var(--frame-line);
  }
  .brand .mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--brass);
  }
  .brand h1{
    font-size:17px;
    margin:6px 0 2px 0;
    font-weight:600;
    line-height:1.25;
  }
  .brand .org{
    font-size:12px;
    color:#8FA6B0;
  }
  nav.navlist{padding:10px 10px; flex:1;}
  .navlist button{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:#B7CBD1;
    font-family:inherit;
    font-size:13.5px;
    padding:10px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:2px;
  }
  .navlist button .dot{
    width:6px;height:6px;border-radius:50%;
    background:#33505E; flex:none;
  }
  .navlist button:hover{background:var(--frame-2); color:#fff;}
  .navlist button.active{background:var(--frame-2); color:#fff;}
  .navlist button.active .dot{background:var(--brass);}
  .sidebar-foot{
    padding:14px 20px 18px 20px;
    border-top:1px solid var(--frame-line);
    font-size:12px;
    color:#8FA6B0;
  }
  .sidebar-foot .who{color:#E6EEEC; font-weight:600; font-size:13px;}
  .sidebar-foot button{
    margin-top:10px;
    background:none;border:1px solid var(--frame-line);
    color:#B7CBD1; padding:6px 10px; border-radius:var(--radius);
    font-family:inherit; font-size:12px; cursor:pointer;
  }
  .sidebar-foot button:hover{border-color:var(--brass); color:var(--brass);}

  /* ---------- MAIN ---------- */
  .main{flex:1; height:100vh; background:var(--paper); min-width:0; display:flex; flex-direction:column; overflow:hidden;}
  .topbar{
    flex:none;
    padding:18px 32px;
    border-bottom:1px solid var(--paper-2);
    display:flex; align-items:baseline; justify-content:space-between;
    background:var(--paper);
  }
  .topbar h2{margin:0; font-size:20px; font-weight:600;}
  .topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}
  .content{padding:26px 32px 60px 32px; flex:1; overflow-y:auto;}

  /* ---------- Common bits ---------- */
  .panel{
    background:#fff;
    border:1px solid var(--paper-2);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .panel h3{margin:0 0 14px 0; font-size:14px; font-weight:600; color:var(--ink);}
  .panel .hint{font-size:12px; color:var(--ink-soft); margin-top:-8px; margin-bottom:14px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:11.5px; color:var(--ink-soft); font-weight:600; letter-spacing:.01em;}
  input, select{
    font-family:inherit; font-size:13.5px;
    padding:8px 10px; border:1px solid #B9CAC5; border-radius:var(--radius);
    background:#fff; color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--brass); outline-offset:0; border-color:var(--brass);}
  button.btn{
    font-family:inherit; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:var(--radius); border:1px solid var(--frame);
    background:var(--frame); color:#fff; cursor:pointer;
  }
  button.btn:hover{background:var(--frame-2);}
  button.btn.brass{background:var(--brass); border-color:var(--brass-dim); color:#0B2130;}
  button.btn.brass:hover{background:var(--brass-dim);}
  button.btn.ghost{background:transparent; color:var(--ink); border-color:#B9CAC5;}
  button.btn.ghost:hover{border-color:var(--ink);}
  button.btn.danger{background:transparent; color:var(--rust); border-color:var(--rust);}
  button.btn.danger:hover{background:var(--rust); color:#fff;}
  button.btn.small{padding:5px 10px; font-size:12px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11px; letter-spacing:.03em; color:var(--ink-soft);
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--paper-2);
  }
  td{padding:9px 10px; border-bottom:1px solid #E7EEEC; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .tag{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px;
    font-weight:600; font-family:'IBM Plex Mono',monospace;
  }
  .tag.ok{background:#DCEAF0; color:var(--teal-dim);}
  .tag.warn{background:#DDEEE6; color:var(--brass-dim);}
  .tag.bad{background:#F5E2DE; color:var(--rust);}
  .tag.neutral{background:#E7ECEA; color:#5B6B67;}
  .empty{
    padding:30px 20px; text-align:center; color:var(--ink-soft);
    border:1px dashed #cfc9ba; border-radius:var(--radius); font-size:13px;
  }

  /* ---------- Login / Setup ---------- */
  .center-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background:var(--frame);
  }
  .login-card{
    width:380px; background:var(--paper); border-radius:4px; padding:34px 32px; position:relative;
  }
  .login-card:before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--brass);
  }
  .login-card .mark{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--brass-dim);}
  .login-card h1{font-size:20px; margin:8px 0 4px 0;}
  .login-card p{font-size:13px; color:var(--ink-soft); margin:0 0 20px 0;}
  .toggle-row{display:flex; gap:8px; margin-bottom:18px;}
  .toggle-row button{
    flex:1; padding:8px; border-radius:var(--radius); border:1px solid #B9CAC5; background:#fff;
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .toggle-row button.active{background:var(--frame); color:#fff; border-color:var(--frame);}

  /* ---------- Gauges ---------- */
  .gauge-grid{display:flex; gap:16px; flex-wrap:wrap;}
  .gauge-card{
    width:150px; background:#fff; border:1px solid var(--paper-2); border-radius:var(--radius);
    padding:14px 12px; text-align:center;
  }
  .gauge-card .kpi-name{font-size:11.5px; font-weight:600; color:var(--ink); min-height:30px; margin-top:6px;}
  .gauge-card .kpi-detail{font-size:10.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
  .gauge-num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:19px;}

  .score-hero{
    display:flex; align-items:center; gap:28px; flex-wrap:wrap;
  }
  .score-hero .big{
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:52px; line-height:1;
  }
  .score-hero .label{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .score-hero .divider{width:1px; align-self:stretch; background:var(--paper-2);}
  .score-hero .stat .num{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:22px;}
  .score-hero .stat .lbl{font-size:11px; color:var(--ink-soft);}

  .weight-bar{height:8px; background:#E7ECEA; border-radius:4px; overflow:hidden; display:flex; margin-top:4px;}
  .weight-bar span{display:block; height:100%;}

  .badge-role{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:2px 7px; border-radius:2px;
    background:var(--paper-2); color:var(--ink-soft);
  }
  .kpi-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid #E7EEEC;
  }
  .kpi-item:last-child{border-bottom:none;}
  .small-muted{font-size:11.5px; color:var(--ink-soft);}
  ::placeholder{color:#8FA39C;}
  .flex-end{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
  .month-nav{display:flex; align-items:center; gap:10px;}
  .month-nav button{background:none;border:1px solid #B9CAC5; border-radius:var(--radius); width:28px; height:28px; cursor:pointer; font-size:14px;}
  .month-nav .mtitle{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; min-width:110px; text-align:center;}

  /* ---------- Print ---------- */
  @media print{
    html, body{ height:auto !important; overflow:visible !important; background:#fff; }
    #app{ height:auto !important; overflow:visible !important; }
    .sidebar, .topbar, .no-print{ display:none !important; }
    .main{ height:auto !important; overflow:visible !important; background:#fff; }
    .content{ height:auto !important; overflow:visible !important; padding:0; }
    .panel{ border:none; box-shadow:none; padding:0; margin-bottom:18px; }
    table{ font-size:12px; }
  }
</style>
</head>

/* ---------------- API layer (Google Sheets via Apps Script) ---------------- */
async function apiGet(key){
  try{
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    return (data && data.value !== undefined) ? data.value : null;
  }catch(e){ console.error('apiGet failed', key, e); return null; }
}
async function apiGetAllCore(){
  try{
    const res = await fetch(`${API_URL}?action=getAll`);
    return await res.json();
  }catch(e){ console.error('apiGetAllCore failed', e); return {}; }
}
async function apiSet(key, valueObj){
  try{
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight against Apps Script
      body: JSON.stringify({action:'set', key, value: JSON.stringify(valueObj), secret: API_SECRET, adminPin: adminAuthPin})
    });
    const data = await res.json();
    if(data && data.error){ console.error('apiSet error', key, data.error); return {ok:false, error:data.error}; }
    return {ok: !!(data && data.ok), error: null};
  }catch(e){ console.error('apiSet failed', key, e); return {ok:false, error:String(e)}; }
}
async function saveKey(key, value){
  const result = await apiSet(key, value);
  if(!result.ok){
    alert('Could not save to the database.\n\nKey: ' + key + '\nReason: ' + (result.error || 'connection problem') + '\n\nYour change was NOT saved. Please try again — if this keeps happening, tell your admin.');
  }
  return result.ok;
}

async function loadAll(){
  const raw = await apiGetAllCore();
  DB.config = raw.config ? JSON.parse(raw.config) : null;
  DB.staff = raw.staff ? JSON.parse(raw.staff) : [];
  DB.kpis = raw['kpi-library'] ? JSON.parse(raw['kpi-library']) : [];
  DB.assignments = raw.assignments ? JSON.parse(raw.assignments) : {};
  DB.slabs = raw.slabs ? JSON.parse(raw.slabs) : {};
  // entries are NOT bulk-loaded here — see ensureEntriesLoaded() below.
  // A single blob of every entry ever made would eventually exceed Google
  // Sheets' ~50,000-character cell limit, so entries are stored and fetched
  // one calendar month at a time instead (key "entries:YYYY-MM").
}

/* ---------------- month-partitioned entries ---------------- */
let loadedEntryMonths = new Set();

function monthKeyFromPeriodKey(periodKey){
  if(periodKey.indexOf('WK-')===0) return periodKey.slice(3,10); // "WK-2026-09-05" -> "2026-09"
  return periodKey.slice(0,7); // daily "2026-09-07" or monthly "2026-09" -> "2026-09"
}

async function ensureEntriesLoaded(monthDate){
  const mk = monthKey(monthDate);
  if(loadedEntryMonths.has(mk)) return;
  const raw = await apiGet('entries:'+mk);
  const parsed = raw ? JSON.parse(raw) : {};
  mergeEntries(parsed);
  loadedEntryMonths.add(mk);
}

function mergeEntries(partial){
  Object.keys(partial).forEach(staffId=>{
    if(!DB.entries[staffId]) DB.entries[staffId] = {};
    Object.keys(partial[staffId]).forEach(kpiId=>{
      if(!DB.entries[staffId][kpiId]) DB.entries[staffId][kpiId] = {};
      Object.assign(DB.entries[staffId][kpiId], partial[staffId][kpiId]);
    });
  });
}

async function persistEntriesForMonth(mk){
  const subset = {};
  Object.keys(DB.entries).forEach(staffId=>{
    Object.keys(DB.entries[staffId]).forEach(kpiId=>{
      Object.keys(DB.entries[staffId][kpiId]).forEach(periodKey=>{
        if(monthKeyFromPeriodKey(periodKey)===mk){
          if(!subset[staffId]) subset[staffId] = {};
          if(!subset[staffId][kpiId]) subset[staffId][kpiId] = {};
          subset[staffId][kpiId][periodKey] = DB.entries[staffId][kpiId][periodKey];
        }
      });
    });
  });
  const sizeCheck = JSON.stringify(subset);
  if(sizeCheck.length > 44000){
    console.warn('entries:'+mk+' is '+sizeCheck.length+' characters — approaching the ~50,000-character Google Sheets cell limit. Older data for this month may need archiving soon.');
  }
  const result = await apiSet('entries:'+mk, subset);
  if(!result.ok){
    alert('This entry was NOT saved.\n\nMonth: ' + mk + '\nReason: ' + (result.error || 'connection problem') + '\n\nPlease try again. If this keeps happening, tell your admin — do not assume it was saved.');
  }
  return result.ok;
}

/* ============================= CALC ENGINE ============================= */
function achievementPct(actual, target, direction){
  if(actual === null || actual === undefined || target === null || target === undefined || target === 0) return null;
  if(direction === 'lower') return (target/actual)*100;
  return (actual/target)*100;
}

// Generic "highest threshold not exceeding the value" lookup, used both for
// incentive slabs (score -> incentive %) and KPI bands (raw value -> achievement %).
function lookupTier(tiers, value, thresholdKey){
  if(value === null || value === undefined) return null;
  const table = (tiers||[]).slice().sort((a,b)=>b[thresholdKey]-a[thresholdKey]);
  for(const t of table){ if(value >= t[thresholdKey]) return t; }
  return table.length ? table[table.length-1] : null;
}

// Build the list of reporting periods a KPI generates within a given month,
// each with the exact moment it becomes overdue.
function pad2(n){ return String(n).padStart(2,'0'); }

function nextWorkingDay(date, workingDays){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const wd = (workingDays && workingDays.length) ? workingDays : [1,2,3,4,5,6]; // default Mon–Sat
  do{ d.setDate(d.getDate()+1); } while(!wd.includes(d.getDay()));
  return d;
}

function getPeriods(kpi, monthDate){
  const y = monthDate.getFullYear(), m = monthDate.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const freq = kpi.frequency || 'monthly';
  const workingDays = DB.config.workingDays || [1,2,3,4,5,6];
  const dailyCutoffHour = DB.config.dailyCutoffHour ?? 17;
  const weeklyDueDay = DB.config.weeklyDueDay ?? 6;
  const weeklyCutoffHour = DB.config.weeklyCutoffHour ?? 13;
  const monthlyCutoffHour = DB.config.monthlyCutoffHour ?? 17;

  if(freq === 'daily'){
    const arr = [];
    for(let d=1; d<=daysInMonth; d++){
      const dayDate = new Date(y, m, d);
      if(!workingDays.includes(dayDate.getDay())) continue; // non-working day (e.g. Sunday) — no entry required, doesn't count at all
      const dow = dayDate.toLocaleDateString('en-GB',{weekday:'short'});
      const nwd = nextWorkingDay(dayDate, workingDays);
      const dueDate = new Date(nwd.getFullYear(), nwd.getMonth(), nwd.getDate(), dailyCutoffHour,0,0);
      arr.push({key:`${y}-${pad2(m+1)}-${pad2(d)}`, label:`${dow} ${d} ${MONTH_NAMES[m]}`, dueDate});
    }
    return arr;
  }

  if(freq === 'weekly'){
    // Weeks are anchored to a fixed weekday (default Saturday) so the cycle
    // stays continuous across month boundaries.
    const arr = [];
    for(let d=1; d<=daysInMonth; d++){
      const dayDate = new Date(y, m, d);
      if(dayDate.getDay() !== weeklyDueDay) continue;
      const weekStart = new Date(y, m, d-6);
      const dueDate = new Date(y, m, d, weeklyCutoffHour,0,0);
      const fmt = (dt)=> `${dt.getDate()} ${MONTH_NAMES[dt.getMonth()]}`;
      arr.push({
        key: `WK-${dayDate.getFullYear()}-${pad2(dayDate.getMonth()+1)}-${pad2(dayDate.getDate())}`,
        label: `Week ending ${fmt(dayDate)} (${fmt(weekStart)}–${fmt(dayDate)})`,
        dueDate
      });
    }
    return arr;
  }

  // monthly — due on config.deadlineDay of the following month
  const dueDate = new Date(y, m+1, DB.config.deadlineDay, monthlyCutoffHour,0,0);
  return [{key:`${y}-${pad2(m+1)}`, label: monthLabel(monthDate), dueDate}];
}

// Roll up every period of one KPI (for one staff member, in one month) into a
// single achievement % — periods whose due date has passed with no entry
// automatically score 0 ("missed"); periods not yet due are excluded.
function rollupForKpi(staffId, kpi, assignment, monthDate){
  const periods = getPeriods(kpi, monthDate);
  const entryMap = ((DB.entries[staffId]||{})[kpi.id]) || {};
  const now = new Date();
  let sum = 0, count = 0;
  const detailed = periods.map(p=>{
    const rec = entryMap[p.key];
    const expected = p.dueDate.getTime() <= now.getTime();
    let pct = null, state = 'pending';
    const type = kpi.type || 'value';
    if(type === 'completion'){
      if(rec && rec.done){ pct = 100; state = rec.onTime ? 'done-ontime' : 'done-late'; }
      else if(expected){ pct = 0; state = 'missed'; }
    } else if(type === 'banded'){
      if(rec && rec.value !== undefined && rec.value !== null){
        const band = lookupTier(kpi.bands, rec.value, 'minValue');
        pct = band ? band.achievementPct : null;
        state = rec.onTime ? 'done-ontime' : 'done-late';
      } else if(expected){ pct = 0; state = 'missed'; }
    } else {
      if(rec && rec.value !== undefined && rec.value !== null){
        pct = achievementPct(rec.value, assignment.target, kpi.direction);
        state = rec.onTime ? 'done-ontime' : 'done-late';
      } else if(expected){ pct = 0; state = 'missed'; }
    }
    if(pct !== null){ sum += Math.min(pct,150); count++; }
    return Object.assign({}, p, {rec, expected, pct, state});
  });
  return {pct: count>0 ? sum/count : null, periods: detailed};
}

function staffMonthlyResult(staffId, monthDate){
  const assigns = DB.assignments[staffId] || [];
  let totalWeight = 0, weightedSum = 0, anyAssessable = false;
  const lines = assigns.map(a=>{
    const kpi = DB.kpis.find(k=>k.id===a.kpiId);
    totalWeight += Number(a.weightage)||0;
    if(!kpi) return {kpi:null, assignment:a, pct:null, periods:[]};
    const roll = rollupForKpi(staffId, kpi, a, monthDate);
    if(roll.pct !== null){
      anyAssessable = true;
      weightedSum += Math.min(roll.pct,150) * (Number(a.weightage)||0) / 100;
    }
    return {kpi, assignment:a, pct: roll.pct, periods: roll.periods};
  });
  const overall = (totalWeight>0 && anyAssessable) ? (weightedSum / (totalWeight/100)) : null;
  return {lines, totalWeight, overall};
}

function incentiveForScore(slabGroup, score){
  const table = DB.slabs[slabGroup] || DB.slabs['Default'] || [];
  return lookupTier(table, score, 'minPct');
}

function tierClass(pct){
  if(pct===null||pct===undefined) return 'neutral';
  if(pct>=100) return 'ok';
  if(pct>=80) return 'warn';
  return 'bad';
}

// Quick-glance panel: for every staff member, shows the status of TODAY's
// daily KPIs and THIS WEEK's weekly KPIs — the "did they update it or not"
// check, computed automatically from due dates, no manual marking needed.
function periodStateTag(state){
  const map = {
    'done-ontime': '<span class="tag ok">Done, on time</span>',
    'done-late': '<span class="tag warn">Done, late</span>',
    'missed': '<span class="tag bad">Missed</span>',
    'pending': '<span class="tag neutral">Pending</span>'
  };
  return map[state] || map.pending;
}

function renderComplianceSnapshot(){
  const now = new Date();
  const rows = [];
  DB.staff.forEach(s=>{
    const assigns = DB.assignments[s.id] || [];
    assigns.forEach(a=>{
      const kpi = DB.kpis.find(k=>k.id===a.kpiId);
      if(!kpi) return;
      const freq = kpi.frequency || 'monthly';
      if(freq !== 'daily' && freq !== 'weekly') return;
      const roll = rollupForKpi(s.id, kpi, a, now);
      const current = roll.periods.find(p=> now >= new Date(p.dueDate.getFullYear(), p.dueDate.getMonth(), p.dueDate.getDate()-((freq==='daily')?0:6), 0,0,0) && now <= p.dueDate) || roll.periods[roll.periods.length-1];
      if(!current) return;
      rows.push({staff:s, kpi, freq, current});
    });
  });
  if(rows.length===0) return el(`<div style="display:none;"></div>`);
  rows.sort((a,b)=>{
    const order = {'missed':0,'pending':1,'done-late':2,'done-ontime':3};
    return (order[a.current.state]??9) - (order[b.current.state]??9);
  });
  const panel = el(`<div class="panel"><h3>Today / this week — compliance snapshot</h3>
    <div class="hint">Daily and weekly KPIs, checked automatically against their due date. Nothing to mark manually — a missed cut-off shows up here on its own.</div>
  </div>`);
  const table = el(`<table><thead><tr><th>Staff</th><th>KPI</th><th>Cadence</th><th>Period</th><th>Status</th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  rows.forEach(r=>{
    const tr = el(`<tr>
      <td><strong>${r.staff.name}</strong></td>
      <td>${r.kpi.name}</td>

      <td>${periodStateTag(r.current.state)}</td>
    </tr>`);

  });
  panel.appendChild(table);
  return panel;
}

/* ============================= TEAM SUMMARY ============================= */
// Aggregates every staff member's monthly result into team-level numbers:
// average achievement/incentive, a distribution across the same ok/warn/bad
// bands used everywhere else, and a per-department roll-up — the "how's the
// whole team doing" view management actually asked for, as opposed to the
// per-staff Overview table.
function computeTeamSummary(monthDate, deptFilter){
  const staffList = DB.staff.filter(s=> s.active!==false && (!deptFilter || deptFilter==='all' || (s.department||'—')===deptFilter));
  const rows = staffList.map(s=>{
    const res = staffMonthlyResult(s.id, monthDate);
    const tier = incentiveForScore(s.slabGroup||'Default', res.overall);
    return {staff:s, res, tier};
  });
  const assessed = rows.filter(r=>r.res.overall!==null);
  const avgAchievement = assessed.length ? assessed.reduce((s,r)=>s+r.res.overall,0)/assessed.length : null;
  const avgIncentive = assessed.length ? assessed.reduce((s,r)=> s + (r.tier?r.tier.incentivePct:0),0)/assessed.length : null;
  const tierCounts = {ok:0, warn:0, bad:0, none:0};
  rows.forEach(r=>{
    if(r.res.overall===null) tierCounts.none++;
    else tierCounts[tierClass(r.res.overall)]++;
  });
  const byDept = {};
  rows.forEach(r=>{
    const d = r.staff.department || 'Unassigned';
    if(!byDept[d]) byDept[d] = {count:0, sum:0, assessedCount:0, incentiveSum:0};
    byDept[d].count++;
    if(r.res.overall!==null){ byDept[d].sum += r.res.overall; byDept[d].assessedCount++; byDept[d].incentiveSum += (r.tier?r.tier.incentivePct:0); }
  });
  const deptRows = Object.keys(byDept).sort().map(d=>{
    const b = byDept[d];
    return {dept:d, count:b.count, avgAchievement: b.assessedCount? b.sum/b.assessedCount : null, avgIncentive: b.assessedCount? b.incentiveSum/b.assessedCount : null};
  });
  rows.sort((a,b)=>{
    const av = a.res.overall===null? -1 : a.res.overall;
    const bv = b.res.overall===null? -1 : b.res.overall;
    return bv-av;
  });
  return {rows, avgAchievement, avgIncentive, tierCounts, deptRows, headcount: rows.length};
}

function gaugeCard(line){
  const pct = line.pct;
  const clampPct = pct===null? 0 : Math.max(0, Math.min(pct,150));
  const angle = (clampPct/150) * 270 - 135; // -135 to 135 deg sweep
  const color = pct===null? '#B7C4C0' : pct>=100? 'var(--teal)' : pct>=80? 'var(--brass)' : 'var(--rust)';
  const kpi = line.kpi;
  const freqLabel = kpi ? ({daily:'Daily', weekly:'Weekly', monthly:'Monthly'}[kpi.frequency||'monthly']) : '';
  const detailText = kpi && kpi.type==='completion' ? `${freqLabel} · qualitative · wt ${line.assignment.weightage}%`
    : kpi && kpi.type==='banded' ? `${freqLabel} · banded (${kpi.unit||''}) · wt ${line.assignment.weightage}%`
    : `${freqLabel} · wt ${line.assignment.weightage}% · tgt ${line.assignment.target}${kpi?kpi.unit:''}`;
  const card = el(`<div class="gauge-card">
    <svg width="90" height="60" viewBox="0 0 100 60">
      <path d="M 10 55 A 40 40 0 1 1 90 55" fill="none" stroke="#DCE8E4" stroke-width="8" stroke-linecap="round"/>
      <path id="arc" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round"/>
    </svg>
    <div class="gauge-num" style="color:${color}">${pct===null?'—':round1(pct)+'%'}</div>
    <div class="kpi-name">${kpi ? kpi.name : 'Unknown KPI'}</div>
    <div class="kpi-detail">${detailText}</div>
  </div>`);
  // draw arc proportion
  const svg = card.querySelector('svg');
  const arcPath = card.querySelector('#arc');
  const frac = clampPct/150;
  const r = 40, cx=50, cy=55;
  const startAngle = -225 * Math.PI/180;
  const sweep = 270 * Math.PI/180 * frac;
  const endAngle = startAngle + sweep;
  const x1 = cx + r*Math.cos(startAngle), y1 = cy + r*Math.sin(startAngle);
  const x2 = cx + r*Math.cos(endAngle), y2 = cy + r*Math.sin(endAngle);
  const large = sweep > Math.PI ? 1 : 0;
  arcPath.setAttribute('d', `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`);
  return card;
}

function renderMonthPicker(onChange){

function buildReportPanel(staffId, monthDate){
  const staff = DB.staff.find(s=>s.id===staffId);

  const panel = el(`<div class="panel" id="report-panel" style="max-width:900px;"></div>`);
  panel.appendChild(reportLetterhead('Monthly KPI &amp; Incentive Report'));
  panel.appendChild(el(`<div class="row" style="margin-bottom:6px;">

  </div>`));

  const table = el(`<table><thead><tr><th>KPI</th><th>Cadence</th><th>Type</th><th>Weight %</th><th>Compliance</th><th>Achievement %</th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  res.lines.forEach(l=>{
    if(!l.kpi) return;
    const freqLabel = {daily:'Daily',weekly:'Weekly',monthly:'Monthly'}[l.kpi.frequency||'monthly'];
    let compliance = '—';
    if(l.periods && l.periods.length){
      if((l.kpi.frequency||'monthly')==='monthly'){
        const p0 = l.periods[0];
        if(p0.rec){
          const valText = l.kpi.type==='completion' ? 'Done' : (p0.rec.value!==undefined ? p0.rec.value+(l.kpi.unit||'') : '—');
          compliance = `${valText} — ${p0.state==='done-ontime'?'On time':'Late'}`;
        } else {
          compliance = p0.expected ? 'Missed' : 'Pending';
        }
      } else {
        const onTime = l.periods.filter(p=>p.state==='done-ontime').length;
        const late = l.periods.filter(p=>p.state==='done-late').length;
        const missed = l.periods.filter(p=>p.state==='missed').length;
        const total = onTime + late + missed;
        compliance = `${onTime} on time, ${late} late, ${missed} missed (of ${total})`;
      }
    }
    const tr = el(`<tr>
      <td>${l.kpi.name}</td>
      <td>${freqLabel}</td>
      <td>${typeLabelFor(l.kpi)}</td>
      <td class="mono">${l.assignment.weightage}%</td>
      <td class="mono small-muted">${compliance}</td>
      <td class="mono"><strong>${l.pct===null?'—':round1(l.pct)+'%'}</strong></td>
    </tr>`);
    tbody.appendChild(tr);
  });
  panel.appendChild(table);

  const summary = el(`<div class="score-hero" style="margin-top:20px; padding-top:16px; border-top:1px solid var(--paper-2);">
    <div><div class="big" style="font-size:34px;">${res.overall===null?'—':round1(res.overall)+'%'}</div><div class="label">Weighted achievement</div></div>

  </div>`);
  panel.appendChild(summary);

  const signoff = el(`<div class="row" style="margin-top:44px;">
    <div class="field" style="flex:1;"><div style="border-top:1px solid #999; padding-top:6px; margin-top:34px;">Reviewed and approved by Hemantha Balasooriya</div></div>

    <div class="field" style="flex:1;"><div style="border-top:1px solid #999; padding-top:6px; margin-top:34px;">HR received</div></div>
  </div>`);
  panel.appendChild(signoff);
  panel.appendChild(reportFooter());
  return panel;
}

/* ============================= MONTHLY ENTRY ============================= */
function renderEntry(root){
  root.innerHTML = '';
  root.appendChild(renderMonthPicker(()=>renderShell()));

  const canPickAnyStaff = session.isAdmin || session.isDataEntryOperator;
  let targetStaffId = canPickAnyStaff ? (adminEntryStaffId || (DB.staff[0]?.id)) : session.id;

  if(canPickAnyStaff){
    const picker = el(`<div class="panel"><div class="field" style="max-width:320px;">
      <label>Staff member</label>
      <select id="entry-staff">${DB.staff.map(s=>`<option value="${s.id}" ${s.id===targetStaffId?'selected':''}>${s.name} — ${s.role}</option>`).join('')}</select>
    </div></div>`);
    root.appendChild(picker);
    picker.querySelector('#entry-staff').onchange = (e)=>{ adminEntryStaffId = e.target.value; renderShell(); };
    if(DB.staff.length===0){
      root.appendChild(el(`<div class="empty">Add staff first under the Staff section.</div>`));
      return;
    }
  }

  const staffObj = DB.staff.find(s=>s.id===targetStaffId);
  const allAssigns = DB.assignments[targetStaffId] || [];
  if(allAssigns.length===0){
    root.appendChild(el(`<div class="empty">No KPIs assigned for this staff member yet.</div>`));
    return;
  }

  const counts = {daily:0, weekly:0, monthly:0};
  allAssigns.forEach(a=>{
    const kpi = DB.kpis.find(k=>k.id===a.kpiId);
    if(kpi) counts[kpi.frequency||'monthly']++;
  });
  const tabsWrap = el(`<div class="toggle-row" style="max-width:520px; margin-bottom:16px;"></div>`);
  [['all',`All (${allAssigns.length})`], ['daily',`Daily (${counts.daily})`], ['weekly',`Weekly (${counts.weekly})`], ['monthly',`Monthly (${counts.monthly})`]].forEach(([key,label])=>{
    const b = el(`<button>${label}</button>`);
    if(key===entryFreqFilter) b.classList.add('active');
    b.onclick = ()=>{ entryFreqFilter = key; renderShell(); };
    tabsWrap.appendChild(b);
  });
  root.appendChild(tabsWrap);

  const assigns = allAssigns.filter(a=>{
    if(entryFreqFilter==='all') return true;
    const kpi = DB.kpis.find(k=>k.id===a.kpiId);
    return kpi && (kpi.frequency||'monthly')===entryFreqFilter;
  });
  if(assigns.length===0){
    root.appendChild(el(`<div class="empty">No ${entryFreqFilter} KPIs assigned.</div>`));
    return;
  }

  assigns.forEach(a=>{
    const kpi = DB.kpis.find(k=>k.id===a.kpiId);
    if(!kpi) return;
    root.appendChild(renderKpiEntryBlock(targetStaffId, kpi, a));
  });
}

function renderKpiEntryBlock(staffId, kpi, assignment){
  const freq = kpi.frequency || 'monthly';
  const type = kpi.type || 'value';
  const roll = rollupForKpi(staffId, kpi, assignment, currentMonth);
  const freqLabel = {daily:'Daily', weekly:'Weekly', monthly:'Monthly'}[freq];
  const typeDesc = type==='value' ? ' · target '+assignment.target+(kpi.unit||'')
    : type==='banded' ? ' · banded scoring ('+(kpi.unit||'')+')'
    : ' · qualitative (done/not done)';
  const panel = el(`<div class="panel">
    <h3>${kpi.name} <span class="small-muted mono">— ${freqLabel}${typeDesc} · weight ${assignment.weightage}%</span></h3>
  </div>`);

  if(freq === 'monthly'){
    // single row, same as a plain monthly value/completion entry
    const p = roll.periods[0];
    panel.appendChild(renderPeriodRow(staffId, kpi, assignment, p));
  } else {
    const list = el(`<div id="entrylist-${kpi.id}" style="max-height:340px; overflow-y:auto; border:1px solid var(--paper-2); border-radius:var(--radius);"></div>`);
    // most relevant first: missed/pending near the top of visible scroll by showing latest period first
    roll.periods.slice().reverse().forEach(p=>{
      list.appendChild(renderPeriodRow(staffId, kpi, assignment, p, true));
    });
    panel.appendChild(list);
  }
  return panel;
}

function renderPeriodRow(staffId, kpi, assignment, p, compact){
  const type = kpi.type || 'value';
  const rec = p.rec;
  const statusHtml = !rec
    ? (p.expected ? '<span class="tag bad">Missed</span>' : '<span class="tag neutral">Pending</span>')
    : (rec.onTime ? '<span class="tag ok">On time</span>' : '<span class="tag warn">Late</span>');
  let valueLine = '';
  if(rec){
    if(type==='completion'){
      valueLine = 'Marked done';
    } else if(type==='banded'){
      const band = lookupTier(kpi.bands, rec.value, 'minValue');
      valueLine = `Value: ${rec.value}${kpi.unit||''} → ${band? band.achievementPct+'% ('+ (band.label||'') +')' : 'no matching band'}`;
    } else {
      const pct = achievementPct(rec.value, assignment.target, kpi.direction);
      valueLine = `Value: ${rec.value}${kpi.unit||''} → ${pct===null?'—':round1(pct)+'%'}`;
    }
  }
  const todayStr = new Date().toISOString().slice(0,10);
  const loggedNote = rec && rec.completedOn && rec.firstEnteredAt && rec.completedOn !== rec.firstEnteredAt.slice(0,10)
    ? ` (logged ${fmtDate(rec.firstEnteredAt)})` : '';
  const row = el(`<div class="kpi-item" style="${compact?'padding:8px 12px;':''}">
    <div style="flex:1;">
      <strong>${p.label}</strong> ${statusHtml}
      ${rec ? `<div class="small-muted mono">${valueLine} — done on ${rec.completedOn || fmtDate(rec.firstEnteredAt)} by ${rec.enteredBy}${loggedNote}</div>` : ''}
    </div>
    <div style="display:flex; align-items:center; gap:8px;" class="entry-controls"></div>
  </div>`);
  const controls = row.querySelector('.entry-controls');
  const dateInput = el(`<input type="date" class="mono" style="width:140px;" value="${rec? (rec.completedOn||todayStr) : todayStr}" title="Date this actually happened">`);
  if(type === 'completion'){
    if(rec && rec.done){
      const undo = el(`<button class="btn ghost small">Undo</button>`);
      undo.onclick = async ()=>{ await removeEntry(staffId, kpi.id, p.key); rerenderEntryPreserveScroll(); };
      controls.appendChild(undo);
    } else {
      const doneBtn = el(`<button class="btn brass small">Mark done</button>`);
      doneBtn.onclick = async ()=>{ await saveEntry(staffId, kpi, p.key, p.dueDate, {done:true}, dateInput.value); rerenderEntryPreserveScroll(); };
      controls.appendChild(dateInput);
      controls.appendChild(doneBtn);
    }
  } else {
    const input = el(`<input type="number" step="any" class="mono" style="width:100px;" value="${rec? rec.value : ''}" placeholder="Actual">`);
    const saveBtn = el(`<button class="btn brass small">Save</button>`);
    saveBtn.onclick = async ()=>{
      const val = parseFloat(input.value);
      if(isNaN(val)){ alert('Enter a numeric value.'); return; }
      await saveEntry(staffId, kpi, p.key, p.dueDate, {value: val}, dateInput.value);
      rerenderEntryPreserveScroll();
    };
    controls.appendChild(input);
    controls.appendChild(dateInput);
    controls.appendChild(saveBtn);
  }
  return row;
}

// Re-renders after an entry save/undo without losing the user's scroll
// position — a bare renderShell() rebuilds #content and every per-KPI list
// from scratch, which resets their scrollTop to 0 and throws the user back
// to the top of a long daily/weekly list every time they tick one item off.
async function rerenderEntryPreserveScroll(){
  const content = document.getElementById('content');
  const contentScroll = content ? content.scrollTop : 0;
  const listScrolls = {};
  document.querySelectorAll('[id^="entrylist-"]').forEach(elx=>{ listScrolls[elx.id] = elx.scrollTop; });
  await renderShell();
  const newContent = document.getElementById('content');
  if(newContent) newContent.scrollTop = contentScroll;
  Object.keys(listScrolls).forEach(id=>{
    const elx = document.getElementById(id);
    if(elx) elx.scrollTop = listScrolls[id];
  });
}

async function saveEntry(staffId, kpi, periodKey, dueDate, payload, completedDateStr){
  if(!DB.entries[staffId]) DB.entries[staffId] = {};
  if(!DB.entries[staffId][kpi.id]) DB.entries[staffId][kpi.id] = {};
  const existing = DB.entries[staffId][kpi.id][periodKey];
  const now = new Date();
  // "completedOn" is the date the work actually happened (as told to us);
  // we score on-time/late against THAT date, not the moment this got typed in.
  let completedRef = now;
  if(completedDateStr){
    const [cy,cm,cd] = completedDateStr.split('-').map(Number);
    completedRef = new Date(cy, cm-1, cd, 23,59,59); // credit them through end of that day
  }
  const onTime = existing ? existing.onTime : (completedRef.getTime() <= dueDate.getTime());
  DB.entries[staffId][kpi.id][periodKey] = Object.assign({}, payload, {
    completedOn: completedDateStr || (existing ? existing.completedOn : now.toISOString().slice(0,10)),
    firstEnteredAt: existing ? existing.firstEnteredAt : now.toISOString(),
    lastUpdatedAt: now.toISOString(),
    enteredBy: session.name,
    onTime
  });
  const mk = monthKeyFromPeriodKey(periodKey);
  loadedEntryMonths.add(mk); // this month's data is now authoritative in memory
  return await persistEntriesForMonth(mk);
}

async function removeEntry(staffId, kpiId, periodKey){
  if(DB.entries[staffId] && DB.entries[staffId][kpiId]){
    delete DB.entries[staffId][kpiId][periodKey];
    const mk = monthKeyFromPeriodKey(periodKey);
    loadedEntryMonths.add(mk);
    await persistEntriesForMonth(mk);
  }
}

// Inline editor for a banded KPI's achievement bands: "value >= X → achievement Y%".
function renderBandsEditor(kpi){
  const wrap = el(`<div style="padding:12px 16px;">
    <div class="small-muted" style="margin-bottom:8px;">Bands for <strong>${kpi.name}</strong> (${kpi.unit||''}) — achievement % applied once the entered value reaches each threshold.</div>
  </div>`);
  const table = el(`<table><thead><tr><th>Value ≥</th><th>Achievement %</th><th>Label</th><th></th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  const bands = (kpi.bands||[]).slice().sort((a,b)=>b.minValue-a.minValue);
  bands.forEach(b=>{
    const realIdx = kpi.bands.indexOf(b);
    const tr = el(`<tr>
      <td><input type="number" step="any" class="mono" style="width:90px;" value="${b.minValue}"></td>
      <td><input type="number" class="mono" style="width:90px;" value="${b.achievementPct}"></td>
      <td><input style="width:100%;" value="${b.label||''}"></td>
      <td><button class="btn danger small">Remove</button></td>
    </tr>`);
    const inputs = tr.querySelectorAll('input');
    inputs[0].onchange = async ()=>{ kpi.bands[realIdx].minValue = parseFloat(inputs[0].value)||0; await saveKey(KEYS.kpis, DB.kpis); };
    inputs[1].onchange = async ()=>{ kpi.bands[realIdx].achievementPct = parseFloat(inputs[1].value)||0; await saveKey(KEYS.kpis, DB.kpis); };
    inputs[2].onchange = async ()=>{ kpi.bands[realIdx].label = inputs[2].value; await saveKey(KEYS.kpis, DB.kpis); };
    tr.querySelector('button').onclick = async ()=>{
      kpi.bands = kpi.bands.filter((x,i)=>i!==realIdx);
      await saveKey(KEYS.kpis, DB.kpis);
      renderShell();
    };
    tbody.appendChild(tr);
  });
  wrap.appendChild(table);
  const addBtn = el(`<div class="flex-end" style="margin-top:8px;"><button class="btn ghost small">+ Add band</button></div>`);
  addBtn.querySelector('button').onclick = async ()=>{
    kpi.bands.push({minValue:0, achievementPct:0, label:'New band'});
    await saveKey(KEYS.kpis, DB.kpis);
    renderShell();
  };
  wrap.appendChild(addBtn);
  return wrap;
}

/* ============================= ASSIGNMENTS ADMIN ============================= */
function renderAssignmentsAdmin(root){
  root.innerHTML = '';
  if(DB.staff.length===0 || DB.kpis.length===0){
    root.appendChild(el(`<div class="empty">Add at least one staff member and one KPI first.</div>`));
    return;
  }
  const sel = el(`<div class="panel"><div class="field" style="max-width:320px;"><label>Staff member</label>
    <select id="asg-staff">${DB.staff.map(s=>`<option value="${s.id}">${s.name} — ${s.role}</option>`).join('')}</select>
  </div></div>`);
  root.appendChild(sel);
  let staffId = DB.staff[0].id;
  sel.querySelector('#asg-staff').onchange = (e)=>{ staffId = e.target.value; drawAssignPanel(); };

  const body = el(`<div id="asg-body"></div>`);
  root.appendChild(body);

  function drawAssignPanel(){
    body.innerHTML = '';
    const assigns = DB.assignments[staffId] || [];
    const totalW = assigns.reduce((s,a)=>s+(Number(a.weightage)||0),0);
    const panel = el(`<div class="panel"><h3>KPI assignments</h3>
      <div class="hint">Total weightage: <strong class="mono">${totalW}%</strong> ${totalW===100?'✓ balanced':'— should total 100%'}</div>
    </div>`);
    if(assigns.length===0){
      panel.appendChild(el(`<div class="empty">No KPIs assigned yet.</div>`));
    } else {
      const table = el(`<table><thead><tr><th>KPI</th><th>Cadence</th><th>Weightage %</th><th>Target</th><th></th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      assigns.forEach((a,idx)=>{
        const kpi = DB.kpis.find(k=>k.id===a.kpiId);
        const freq = kpi ? (kpi.frequency||'monthly') : 'monthly';
        const type = kpi ? (kpi.type||'value') : 'value';
        const freqLabel = {daily:'Daily',weekly:'Weekly',monthly:'Monthly'}[freq];
        const tr = el(`<tr>
          <td><strong>${kpi?kpi.name:'Unknown'}</strong> <span class="small-muted mono">${kpi && type==='value' ?(kpi.direction==='lower'?'(lower better)':'(higher better)'):(type==='completion'?'(qualitative)':type==='banded'?'(banded)':'')}</span></td>
          <td>${freqLabel}</td>
          <td><input type="number" class="mono" style="width:80px;" value="${a.weightage}"></td>
          <td>${type!=='value' ? '<span class="small-muted">'+(type==='banded'?'— scored by bands —':'— done/not done —')+'</span>' : `<input type="number" step="any" class="mono" style="width:100px;" value="${a.target}"> <span class="small-muted">${kpi?kpi.unit:''} / ${freqLabel.toLowerCase()}</span>`}</td>
          <td><button class="btn danger small">Remove</button></td>
        </tr>`);
        const wInput = tr.querySelectorAll('input')[0];
        wInput.onchange = async ()=>{ a.weightage = parseFloat(wInput.value)||0; await saveKey(KEYS.assignments, DB.assignments); drawAssignPanel(); };
        if(type==='value'){
          const tInput = tr.querySelectorAll('input')[1];
          tInput.onchange = async ()=>{ a.target = parseFloat(tInput.value)||0; await saveKey(KEYS.assignments, DB.assignments); };
        }
        tr.querySelector('button').onclick = async ()=>{
          DB.assignments[staffId] = assigns.filter((x,i)=>i!==idx);
          await saveKey(KEYS.assignments, DB.assignments);
          drawAssignPanel();
        };
        tbody.appendChild(tr);
      });
      panel.appendChild(table);
    }

    const assignedIds = assigns.map(a=>a.kpiId);
    const available = DB.kpis.filter(k=>!assignedIds.includes(k.id));
    const selectedKpi = available[0];
    const addRow = el(`<div class="row" style="margin-top:14px; align-items:flex-end;">
      <div class="field"><label>Add KPI</label>
        <select id="add-kpi">${available.map(k=>`<option value="${k.id}">${k.name} (${ {daily:'Daily',weekly:'Weekly',monthly:'Monthly'}[k.frequency||'monthly'] })</option>`).join('') || '<option value="">All KPIs assigned</option>'}</select>
      </div>
      <div class="field"><label>Weightage %</label><input id="add-w" type="number" style="width:90px;" value="0"></div>
      <div class="field" id="add-t-field"><label>Target</label><input id="add-t" type="number" step="any" style="width:110px;" value="0"></div>
      <div class="field"><button class="btn brass" id="add-go" ${available.length?'':'disabled'}>Add</button></div>
    </div>`);
    const kpiSel = addRow.querySelector('#add-kpi');
    const tField = addRow.querySelector('#add-t-field');
    function syncTargetField(){
      const k = DB.kpis.find(x=>x.id===kpiSel.value);
      tField.style.display = (k && (k.type||'value')!=='value') ? 'none' : 'flex';
    }
    kpiSel?.addEventListener('change', syncTargetField);
    syncTargetField();
    addRow.querySelector('#add-go')?.addEventListener('click', async ()=>{
      const kpiId = kpiSel.value;
      const k = DB.kpis.find(x=>x.id===kpiId);
      const weightage = parseFloat(addRow.querySelector('#add-w').value)||0;
      const target = (k && (k.type||'value')!=='value') ? null : (parseFloat(addRow.querySelector('#add-t').value)||0);
      if(!kpiId) return;
      if(!DB.assignments[staffId]) DB.assignments[staffId] = [];
      DB.assignments[staffId].push({kpiId, weightage, target});
      await saveKey(KEYS.assignments, DB.assignments);
      drawAssignPanel();
    });
    panel.appendChild(addRow);
    body.appendChild(panel);
  }
  drawAssignPanel();
}

/* ============================= SLABS ADMIN ============================= */
function renderSlabsAdmin(root){
  root.innerHTML = '';
  const groups = Object.keys(DB.slabs);
  const newGroupPanel = el(`<div class="panel"><h3>Slab groups</h3>
    <div class="hint">Different roles can follow different incentive slab tables. Assign a staff member's slab group under Staff.</div>
    <div class="row" style="align-items:flex-end;">
      <div class="field"><label>New slab group name</label><input id="ng-name" placeholder="e.g. Supervisors"></div>
      <div class="field"><button class="btn brass" id="ng-add">Create group</button></div>
    </div>
  </div>`);
  root.appendChild(newGroupPanel);
  newGroupPanel.querySelector('#ng-add').onclick = async ()=>{
    const name = newGroupPanel.querySelector('#ng-name').value.trim();
    if(!name){ return; }
    if(DB.slabs[name]){ alert('That group already exists.'); return; }
    DB.slabs[name] = [
      {minPct:100, incentivePct:100, label:'Target met or exceeded'},
      {minPct:70, incentivePct:80, label:'Acceptable'},
      {minPct:0, incentivePct:0, label:'Below threshold'}
    ];
    await saveKey(KEYS.slabs, DB.slabs);
    renderShell();
  };

  groups.forEach(g=>{
    const tiers = DB.slabs[g].slice().sort((a,b)=>b.minPct-a.minPct);
    const panel = el(`<div class="panel"><h3>${g}${g==='Default'?' <span class="small-muted">(fallback)</span>':''}</h3>
      <div class="hint">If weighted achievement % is at or above the minimum, that tier's incentive % applies.</div>
    </div>`);
    const table = el(`<table><thead><tr><th>Min achievement %</th><th>Incentive %</th><th>Label</th><th></th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    tiers.forEach((t)=>{
      const realIdx = DB.slabs[g].indexOf(t);
      const tr = el(`<tr>
        <td><input type="number" class="mono" style="width:90px;" value="${t.minPct}"></td>
        <td><input type="number" class="mono" style="width:90px;" value="${t.incentivePct}"></td>
        <td><input style="width:100%;" value="${t.label||''}"></td>
        <td><button class="btn danger small">Remove</button></td>
      </tr>`);
      const inputs = tr.querySelectorAll('input');
      inputs[0].onchange = async ()=>{ DB.slabs[g][realIdx].minPct = parseFloat(inputs[0].value)||0; await saveKey(KEYS.slabs, DB.slabs); };
      inputs[1].onchange = async ()=>{ DB.slabs[g][realIdx].incentivePct = parseFloat(inputs[1].value)||0; await saveKey(KEYS.slabs, DB.slabs); };
      inputs[2].onchange = async ()=>{ DB.slabs[g][realIdx].label = inputs[2].value; await saveKey(KEYS.slabs, DB.slabs); };
      tr.querySelector('button').onclick = async ()=>{
        DB.slabs[g] = DB.slabs[g].filter((x,i)=>i!==realIdx);
        await saveKey(KEYS.slabs, DB.slabs);
        renderShell();
      };
      tbody.appendChild(tr);
    });
    panel.appendChild(table);
    const addTier = el(`<div class="flex-end" style="margin-top:10px;"><button class="btn ghost small">+ Add tier</button></div>`);
    addTier.querySelector('button').onclick = async ()=>{
      DB.slabs[g].push({minPct:0, incentivePct:0, label:'New tier'});
      await saveKey(KEYS.slabs, DB.slabs);
      renderShell();
    };
    panel.appendChild(addTier);
    if(g!=='Default'){
      const delGroup = el(`<div class="flex-end" style="margin-top:4px;"><button class="btn danger small">Delete group</button></div>`);
      delGroup.querySelector('button').onclick = async ()=>{
        if(!confirm(`Delete slab group "${g}"? Staff using it will fall back to Default.`)) return;
        delete DB.slabs[g];
        await saveKey(KEYS.slabs, DB.slabs);
        renderShell();
      };
      panel.appendChild(delGroup);
    }
    root.appendChild(panel);
  });
}

/* ============================= SETTINGS ADMIN ============================= */
function renderSettingsAdmin(root){
  root.innerHTML = '';
  const workingDays = DB.config.workingDays || [1,2,3,4,5,6];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dailyCutoffHour = DB.config.dailyCutoffHour ?? 17;
  const weeklyDueDay = DB.config.weeklyDueDay ?? 6; // Saturday
  const weeklyCutoffHour = DB.config.weeklyCutoffHour ?? 13;
  const monthlyCutoffHour = DB.config.monthlyCutoffHour ?? 17;

  function hourLabel(h){
    return h===0?'12:00 AM':h<12?`${h}:00 AM`:h===12?'12:00 PM':`${h-12}:00 PM`;
  }
  function hourOptions(selected){
    let opts = '';
    for(let h=0; h<24; h++){
      opts += `<option value="${h}" ${h===selected?'selected':''}>${hourLabel(h)}</option>`;
    }
    return opts;
  }

  const orgPanel = el(`<div class="panel"><h3>Console settings</h3>
    <div class="row">
      <div class="field"><label>Organisation / plant name</label><input id="cfg-org" value="${DB.config.orgName}"></div>
    </div>
    <div class="flex-end"><button class="btn brass" id="cfg-org-save">Save</button></div>
  </div>`);
  root.appendChild(orgPanel);
  orgPanel.querySelector('#cfg-org-save').onclick = async ()=>{
    DB.config.orgName = orgPanel.querySelector('#cfg-org').value.trim() || DB.config.orgName;
    await saveKey(KEYS.config, DB.config);
    renderShell();
  };

  const dailyPanel = el(`<div class="panel"><h3>Daily KPI deadline</h3>
    <div class="hint">Applies to every KPI set to Daily cadence. An entry becomes "Missed" once this cut-off passes with nothing recorded for that day.</div>
    <div class="row">
      <div class="field"><label>Due by</label><select id="cfg-daily-hour">${hourOptions(dailyCutoffHour)}</select></div>
      <div class="field" style="flex:1;"><label>On which day</label><div style="padding-top:8px; font-size:13px;">the next <strong>working day</strong> after the entry's date</div></div>
    </div>
    <div class="field">
      <label>Working days (a Daily KPI only requires an entry on these days — unchecked days, e.g. Sunday, are skipped entirely and never count against anyone)</label>
      <div class="row" id="cfg-workdays" style="gap:14px;">
        ${dayNames.map((n,i)=>`<label style="display:flex; align-items:center; gap:5px; font-weight:400; font-size:13px; color:var(--ink);"><input type="checkbox" value="${i}" ${workingDays.includes(i)?'checked':''}> ${n}</label>`).join('')}
      </div>
    </div>
    <div class="flex-end"><button class="btn brass" id="cfg-daily-save">Save daily rule</button></div>
  </div>`);
  root.appendChild(dailyPanel);
  dailyPanel.querySelector('#cfg-daily-save').onclick = async ()=>{
    DB.config.dailyCutoffHour = parseInt(dailyPanel.querySelector('#cfg-daily-hour').value);
    DB.config.workingDays = Array.from(dailyPanel.querySelectorAll('#cfg-workdays input:checked')).map(c=>parseInt(c.value));
    await saveKey(KEYS.config, DB.config);
    renderShell();
  };

  const weeklyPanel = el(`<div class="panel"><h3>Weekly KPI deadline</h3>
    <div class="hint">Applies to every KPI set to Weekly cadence. Weeks are anchored to this day of the week so the cycle stays continuous across months.</div>
    <div class="row">
      <div class="field"><label>Due day</label>
        <select id="cfg-weekly-day">${dayNames.map((n,i)=>`<option value="${i}" ${i===weeklyDueDay?'selected':''}>${n}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Due by</label><select id="cfg-weekly-hour">${hourOptions(weeklyCutoffHour)}</select></div>
    </div>
    <div class="flex-end"><button class="btn brass" id="cfg-weekly-save">Save weekly rule</button></div>
  </div>`);
  root.appendChild(weeklyPanel);
  weeklyPanel.querySelector('#cfg-weekly-save').onclick = async ()=>{
    DB.config.weeklyDueDay = parseInt(weeklyPanel.querySelector('#cfg-weekly-day').value);
    DB.config.weeklyCutoffHour = parseInt(weeklyPanel.querySelector('#cfg-weekly-hour').value);
    await saveKey(KEYS.config, DB.config);
    renderShell();
  };

  const monthlyPanel = el(`<div class="panel"><h3>Monthly KPI deadline</h3>
    <div class="hint">Applies to every KPI set to Monthly cadence — due in the month following the one being reported on.</div>
    <div class="row">
      <div class="field"><label>Due on day</label><input id="cfg-deadline" type="number" min="1" max="28" value="${DB.config.deadlineDay}" style="width:90px;"></div>
      <div class="field"><label>of the following month, due by</label><select id="cfg-monthly-hour">${hourOptions(monthlyCutoffHour)}</select></div>
    </div>
    <div class="flex-end"><button class="btn brass" id="cfg-monthly-save">Save monthly rule</button></div>
  </div>`);
  root.appendChild(monthlyPanel);
  monthlyPanel.querySelector('#cfg-monthly-save').onclick = async ()=>{
    DB.config.deadlineDay = parseInt(monthlyPanel.querySelector('#cfg-deadline').value)||5;
    DB.config.monthlyCutoffHour = parseInt(monthlyPanel.querySelector('#cfg-monthly-hour').value);
    await saveKey(KEYS.config, DB.config);
    renderShell();
  };

  const summaryPanel = el(`<div class="panel">
    <div class="hint" style="margin:0;">
      <strong>Deadline rules currently applied:</strong><br>
      Daily — due ${hourLabel(dailyCutoffHour)} on the next working day.<br>
      Weekly — due ${hourLabel(weeklyCutoffHour)} every ${dayNames[weeklyDueDay]}.<br>
      Monthly — due ${hourLabel(monthlyCutoffHour)} on day ${DB.config.deadlineDay} of the following month.
    </div>
  </div>`);
  root.appendChild(summaryPanel);

  const accessPanel = el(`<div class="panel"><h3>Data entry access</h3>
    <div class="hint">Choose who is allowed to enter daily/weekly/monthly actuals. Staff can always see their own achievement and incentive standing regardless of this setting — this only controls who can key in data.</div>
    <div class="row">
      <div class="field">
        <select id="cfg-entrymode">
          <option value="shared" ${DB.config.entryMode!=='adminOnly'?'selected':''}>Admin and staff can both enter data</option>
          <option value="adminOnly" ${DB.config.entryMode==='adminOnly'?'selected':''}>Admin only — staff are view-only</option>
        </select>
      </div>
      <div class="field"><button class="btn brass" id="cfg-entrymode-save">Save</button></div>
    </div>
  </div>`);
  root.appendChild(accessPanel);
  accessPanel.querySelector('#cfg-entrymode-save').onclick = async ()=>{
    DB.config.entryMode = accessPanel.querySelector('#cfg-entrymode').value;
    await saveKey(KEYS.config, DB.config);
    renderShell();
  };

  const dataEntryPanel = el(`<div class="panel"><h3>Data Entry Operator access</h3>
    <div class="hint">Gives one person a login that can record daily/weekly/monthly actuals for any staff member — nothing else. They won't see Staff, KPI Library, Assignments, Slabs, Settings or Reports. Leave the passcode blank and save to remove this access entirely.</div>
    <div class="row">
      <div class="field"><label>Display name</label><input id="cfg-de-name" placeholder="e.g. Kamal" value="${DB.config.dataEntryName||''}"></div>
      <div class="field"><label>Passcode</label><input id="cfg-de-pin" type="password" placeholder="${DB.config.dataEntryPin?'Leave blank to keep current':'Set a passcode'}"></div>
      <div class="field"><button class="btn brass" id="cfg-de-save">Save</button></div>
    </div>
    <div class="hint" style="margin-bottom:0;">${DB.config.dataEntryPin ? 'Data Entry access is currently <strong>enabled</strong>.' : 'Data Entry access is currently <strong>off</strong> — no login option shows until a passcode is set.'}</div>
  </div>`);
  root.appendChild(dataEntryPanel);
  dataEntryPanel.querySelector('#cfg-de-save').onclick = async ()=>{
    const name = dataEntryPanel.querySelector('#cfg-de-name').value.trim();
    const pinInput = dataEntryPanel.querySelector('#cfg-de-pin').value.trim();
    DB.config.dataEntryName = name;
    if(pinInput){ DB.config.dataEntryPin = pinInput; }
    const ok = await saveKey(KEYS.config, DB.config);
    if(ok){ renderShell(); } else { alert('Could not save — check your connection and try again.'); }
  };
  // Separate, explicit way to switch access off, since an empty passcode
  // field above means "keep current" rather than "clear it".
  if(DB.config.dataEntryPin){
    const removeRow = el(`<div class="panel"><div class="flex-end"><button class="btn danger small" id="cfg-de-remove">Remove Data Entry access</button></div></div>`);
    root.appendChild(removeRow);
    removeRow.querySelector('#cfg-de-remove').onclick = async ()=>{
      if(!confirm('Remove Data Entry Operator access? Anyone currently signed in with that passcode will be unable to save further entries.')) return;
      delete DB.config.dataEntryPin;
      delete DB.config.dataEntryName;
      const ok = await saveKey(KEYS.config, DB.config);
      if(ok){ renderShell(); } else { alert('Could not save — check your connection and try again.'); }
    };
  }

  const pinPanel = el(`<div class="panel"><h3>Change admin passcode</h3>
    <div class="row">
      <div class="field"><label>New passcode</label><input id="cfg-pin" type="password" placeholder="New passcode"></div>
      <div class="field"><button class="btn ghost" id="cfg-pin-save">Update passcode</button></div>
    </div>
  </div>`);
  root.appendChild(pinPanel);
  pinPanel.querySelector('#cfg-pin-save').onclick = async ()=>{
    const pin = pinPanel.querySelector('#cfg-pin').value.trim();
    if(!pin){ return; }
    const oldPin = DB.config.adminPin;
    DB.config.adminPin = pin;
    const ok = await saveKey(KEYS.config, DB.config); // authenticates with adminAuthPin, still the OLD pin at this point
    if(ok){
      adminAuthPin = pin;
      alert('Passcode updated.');
    } else {
      DB.config.adminPin = oldPin;
      alert('Could not update the passcode — check your connection and try again.');
    }
  };
}

/* ============================= START ============================= */
boot();
</script>
</body>
</html>
